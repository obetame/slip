name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# A tag can be pushed more than once: retagging a release means deleting the
# tag and creating it again, and the second push starts a whole second
# pipeline while the first is still waiting on Apple. Both of them then try to
# publish the same tag, which is how v0.2.0 ended up with two release pages
# carrying the same six files.
#
# Only the newest push to a tag is worth finishing, so the older run is
# cancelled instead of queued behind it.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

# Two builders because notarization needs macOS and its tools only ship
# there. Linux and Windows archives stay on the cheaper Ubuntu runner; the
# macOS archive is built, signed, and notarized on macOS so Gatekeeper does
# not stop the first run on another Mac.
jobs:
  unix:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: build linux and windows archives
        env:
          SLIP_RELEASE_TAG: ${{ github.ref_name }}
        # dist.sh builds all six targets; the macOS ones are built again and
        # better on the macOS runner, so only these four are kept.
        run: |
          bash scripts/dist.sh
          rm -f dist/*darwin*.tar.gz
          ( cd dist && shasum -a 256 *.tar.gz *.zip | LC_ALL=C sort -k2 > SHA256SUMS )
      - uses: actions/upload-artifact@v4
        with:
          name: archives-unix
          if-no-files-found: error
          path: dist/*

  macos:
    runs-on: macos-latest
    # The signing and notarization credentials live on this environment,
    # not on the repository. A job without this line reads empty secrets.
    environment: desktop-production
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # The certificate arrives as base64 in a secret. Importing it into a
      # throwaway keychain keeps the runner clean, and the partition list
      # pre-authorizes codesign so it never waits on a dialog.
      - name: import signing certificate
        env:
          CERT_P12: ${{ secrets.MAC_CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then
            echo "MAC_CSC_LINK is empty. Check that the job declares" >&2
            echo "environment: desktop-production and that the secret exists there." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/slip-signing.keychain-db"
          password=$(openssl rand -base64 32)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: build, sign, and notarize
        env:
          SLIP_RELEASE_TAG: ${{ github.ref_name }}
          SLIP_APPLE_ID: ${{ secrets.APPLE_ID }}
          SLIP_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SLIP_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Never fall through to an unsigned archive here. A release that
          # cannot be signed is a broken release, and failing loudly is the
          # only way the next person finds out why.
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "the imported keychain has no Developer ID Application identity" >&2
            echo "the p12 must contain the certificate AND its private key" >&2
            security find-identity -v -p codesigning >&2 || true
            exit 1
          fi
          id=$(security find-identity -v -p codesigning \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*\) ([0-9A-F]{40}) .*/\1/')
          echo "signing with $id"
          SLIP_SIGN_IDENTITY="$id" bash scripts/dist-darwin.sh

      - name: verify signature and Gatekeeper
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const Current = "\([^"]*\)"$/\1/p' internal/version/version.go)
          archive="dist/slip_${version}_darwin_universal.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/slip"
          # spctl is the real test: it fails for a signed but un-notarized
          # binary, which is exactly what this job exists to prevent.
          #
          # The type is install, not exec, and that is measured rather than
          # assumed. On macOS 26, exec rejects a bare executable out of hand,
          # even a signed one from Apple itself:
          #
          #   spctl -a -vvv -t exec /bin/ls
          #   /bin/ls: rejected (the code is valid but does not seem to be an app)
          #
          # exec is a policy about app bundles. install is the one that
          # answers for a command line tool, and it is the type that reported
          # "source=Unnotarized Developer ID" for the signed but unnotarized
          # build during local testing. slip is still notarized through the
          # binary's own ticket; only the way of asking about it changes.
          spctl -a -vvv -t install "$RUNNER_TEMP/slip" || {
            echo "Gatekeeper rejects the archive; check the notarization secrets" >&2
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: archives-macos
          if-no-files-found: error
          path: dist/*

  publish:
    needs: [unix, macos]
    runs-on: ubuntu-latest
    steps:
      # The notes come from the changelogs in the repository, so the release
      # page says what changed rather than what an archive is.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum *.tar.gz *.zip | LC_ALL=C sort -k2 > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repository, so gh has no git remote
          # to infer the repository from and every release command without an
          # explicit --repo fails with "not a git repository". Naming the
          # repository once here covers all of them.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # changelog FILE prints the section for this version: everything
          # under "## <version>" up to the next "## " heading. A missing
          # section stops the job, because a release page that says nothing
          # about the release is the thing this step exists to prevent.
          changelog() {
            awk -v v="$version" '
              /^## / { if (on) exit; if ($2 == v) on = 1; next }
              on && !begun && $0 == "" { next }
              on { begun = 1; print }
            ' "$1"
          }
          en=$(changelog CHANGELOG.md)
          zh=$(changelog CHANGELOG.zh-CN.md)
          if [ -z "$en" ] || [ -z "$zh" ]; then
            echo "slip: $version has no section in CHANGELOG.md or CHANGELOG.zh-CN.md" >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/notes.md"
          {
            printf '%s\n\n' "$en"
            printf '%s\n\n' "$zh"
            printf -- '---\n\n'
            printf '%s\n\n' 'Archives for Linux, macOS, and Windows. SHA256SUMS lists each file. The tag matches the version printed by slip --version. The macOS archive is signed and notarized, so it opens without a Gatekeeper prompt. To upgrade, stop slip, replace the binary, and start it again: the data directory keeps the slips.'
            printf '%s\n' 'Linux、macOS 和 Windows 的压缩包。SHA256SUMS 是每个文件的校验值。标签和 slip --version 打印的版本一致。macOS 的包已签名并公证，打开时不会出现拦截提示。升级方法：停掉 slip，替换二进制，再启动；数据目录里的内容不受影响。'
          } > "$notes"

          # Moving a tag means deleting it and creating it again, and deleting a
          # tag demotes the release that was published for it to a draft. A
          # draft is invisible to /releases/tags/<tag>: that endpoint answers
          # 404, which reads exactly like "no release yet". Asking by tag is
          # therefore how every retag produced a second release page. The list
          # endpoint does include drafts, so ask the list instead.
          rows=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) \(.draft)\"") || {
            echo "slip: could not list releases for $GITHUB_REF_NAME" >&2
            exit 1
          }

          # Newest first. Whatever comes after the first row is a leftover:
          # drafts are removed without asking, because nobody can see them and
          # they are the debris this pipeline itself leaves behind. A second
          # published release is different, so the job stops and says so rather
          # than deleting something a person may have meant to keep.
          keep=$(printf '%s\n' "$rows" | awk 'NF { print $1; exit }')
          while read -r id draft; do
            if [ "$draft" = "true" ]; then
              echo "slip: removing leftover draft release $id" >&2
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null
            else
              echo "slip: $GITHUB_REF_NAME has two published releases, $keep and $id" >&2
              exit 1
            fi
          done < <(printf '%s\n' "$rows" | awk 'NF' | tail -n +2)

          if [ -n "$keep" ]; then
            # Assets first, then the draft flag, so a draft never goes public
            # without the files it is supposed to carry.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false \
              --title "slip ${GITHUB_REF_NAME#v}" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "slip ${GITHUB_REF_NAME#v}" \
              --notes-file "$notes" \
              dist/*
          fi
